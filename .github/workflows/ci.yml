name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tomato_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d tomato_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_DIRECT_URL: postgresql+psycopg://test:test@localhost:5432/tomato_test
      DATABASE_DIRECT_URL: postgresql+psycopg://test:test@localhost:5432/tomato_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests migrations
      - run: alembic upgrade head
      - run: python -m app.db.seed
      - run: python -m pytest tests -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser flow with reviewed JSON
        run: |
          KNOWLEDGE_MODE=verified uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/healthz
          npm run test:browser:verified
